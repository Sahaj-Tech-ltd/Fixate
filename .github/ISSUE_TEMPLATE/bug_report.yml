name: Bug Report
description: Report a bug in Fixate
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting a bug! Please fill out the details below."
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to trigger the bug
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (browser)
        - Desktop (.deb)
        - Desktop (.AppImage)
        - Desktop (.msi/.exe)
        - Docker self-hosted
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser (if web)
      placeholder: "Firefox 128, Chrome 132, etc."
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Screenshots, error messages, console output
