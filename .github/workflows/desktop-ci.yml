name: desktop-ci

on:
  push:
    branches: [main, beta]
    paths:
      - 'desktop/**'
      - 'config/**'
      - 'apps/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'config/**'
      - 'apps/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'manage.py'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      # ---- Linux system deps (Tauri + WebView) ----
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      # ---- Python + backend build ----
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Collect static files
        run: python manage.py collectstatic --noinput

      - name: Build backend (PyInstaller)
        run: |
          pyinstaller \
            --onefile \
            --name fixate-backend \
            --distpath desktop/dist \
            --workpath desktop/build \
            --specpath /tmp \
            --add-data "config:config" \
            --add-data "apps:apps" \
            --add-data "templates:templates" \
            --add-data "static:static" \
            --add-data "staticfiles:staticfiles" \
            --hidden-import django \
            --hidden-import django.contrib.admin \
            --hidden-import django.contrib.auth \
            --hidden-import django.contrib.contenttypes \
            --hidden-import django.contrib.sessions \
            --hidden-import django.contrib.messages \
            --hidden-import django.contrib.staticfiles \
            --hidden-import django.contrib.sites \
            --hidden-import rest_framework \
            --hidden-import rest_framework.authentication \
            --collect-submodules rest_framework \
            --hidden-import allauth \
            --collect-submodules allauth \
            --hidden-import whitenoise \
            --hidden-import whitenoise.storage \
            --collect-submodules whitenoise \
            --hidden-import django_htmx \
            --collect-submodules django_htmx \
            --hidden-import environ \
            --hidden-import storages \
            --hidden-import config.backends \
            --hidden-import config.backends.database \
            --hidden-import config.backends.storage \
            --hidden-import config.backends.ocr \
            --hidden-import config.backends.tasks \
            --hidden-import config.backends.auth \
            --hidden-import config.backends.media \
            --hidden-import config.middleware \
            desktop/backend_entry.py

      # PyInstaller on Windows adds .exe — Tauri resource path expects bare name
      - name: Normalize backend name (Windows)
        if: runner.os == 'Windows'
        run: copy desktop\dist\fixate-backend.exe desktop\dist\fixate-backend
        shell: cmd

      # ---- Rust + Tauri build ----
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      - name: Build Tauri app
        run: cargo tauri build --ci
        working-directory: desktop/src-tauri

      # ---- Upload artifacts ----
      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Fixate-linux-amd64.deb
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Fixate-linux-x86_64.AppImage
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Windows .msi
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Fixate-windows-x64.msi
          path: desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: Upload Windows .exe installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Fixate-windows-x64-setup.exe
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: fixate-backend-${{ runner.os }}-${{ runner.arch }}
          path: desktop/dist/fixate-backend*
          if-no-files-found: error
