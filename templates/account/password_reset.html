{% extends "base.html" %}

{% block title %}Reset Password - Fixate{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Reset Password</h1>
    
    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send Reset Link</button>
    </form>
</div>
{% endblock %}
