services:
  db:
    image: postgres:16-alpine
    container_name: fixate_db
    environment:
      POSTGRES_DB: fixate
      POSTGRES_USER: fixate
      POSTGRES_PASSWORD: fixate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fixate_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: fixate_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - FIXATE_MODE=cloud
      - DB_HOST=db
      - DB_NAME=fixate
      - DB_USER=fixate
      - DB_PASSWORD=fixate
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery:
    build: .
    container_name: fixate_celery
    command: celery -A config worker -l INFO
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - FIXATE_MODE=cloud
      - DB_HOST=db
      - DB_NAME=fixate
      - DB_USER=fixate
      - DB_PASSWORD=fixate
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
